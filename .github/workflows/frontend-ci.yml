name: Frontend CI

on:
  pull_request:
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'vite.config.ts'
      - 'eslint.config.js'
      - '.github/workflows/frontend-ci.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'vite.config.ts'
      - 'eslint.config.js'
      - '.github/workflows/frontend-ci.yml'

# 🛡️ Sentinel: least privilege. Without this, GITHUB_TOKEN inherits the repo's
# default (often read/write) scopes; this job only needs to read the code, so
# we drop everything else to limit blast radius if a build step is compromised.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      # Type-checks (tsc -b) and bundles (vite build). Vite does not execute app
      # modules at build time, so no Supabase secrets are required here.
      - name: Build
        run: npm run build
